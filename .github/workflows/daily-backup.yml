name: Daily Backup / Keep Alive

on:
  schedule:
    # 毎日 朝5時 JST（= 20:00 UTC）
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # 毎日アクセスすることで、Supabase無料枠の自動停止を防ぐ
      - name: Backup all tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup.mjs

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: workout-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
